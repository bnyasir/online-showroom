<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />
  <title>Abdul Sajed Car — Showroom Management</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">AS</div><div><strong>Abdul Sajed Car</strong><small>Showroom Management</small></div></div>
      <div class="nav-label" data-i18n="workspace">WORKSPACE</div>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom"><div class="online-dot"></div><span data-i18n="localMode">Local demo mode</span><button id="resetData" class="icon-button" title="Reset demo data" aria-label="Reset demo data">↻</button></div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button id="menuToggle" class="icon-button mobile-menu" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumb"><span data-i18n="workspace">WORKSPACE</span><span class="crumb-slash">/</span><strong id="currentSection">Dashboard</strong></div>
        <div class="top-actions"><button id="languageToggle" class="language-button">العربية</button><button class="icon-button notification-button" aria-label="Notifications">♧<i></i></button><div class="profile"><div class="avatar">AS</div><div class="profile-copy"><strong>Abdul Sajed</strong><small data-i18n="administrator">Administrator</small></div></div></div>
      </header>
      <section class="page-content" id="pageContent"></section>
      <footer class="footer"><span>© <span id="year"></span> Abdul Sajed Car</span><span data-i18n="footerNote">Showroom operations, made simple.</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="recordDialog" class="record-dialog"><form id="recordForm"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="recordDetails">RECORD DETAILS</span><h2 id="dialogTitle">Add record</h2></div><button type="button" class="icon-button" id="closeDialog" aria-label="Close">✕</button></div><div id="formFields" class="form-fields"></div><div class="dialog-actions"><button type="button" class="button button-quiet" id="cancelDialog">Cancel</button><button type="submit" class="button button-primary" data-i18n="saveRecord">Save record</button></div></form></dialog>
</body>
</html>
